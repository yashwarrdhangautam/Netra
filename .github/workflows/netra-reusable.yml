# NETRA Security Scan - Reusable Workflow
# Use this workflow to run NETRA security scans in your CI/CD pipeline

name: NETRA Security Scan

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Target URL or domain to scan"
      profile:
        required: false
        type: string
        default: "quick"
        description: "Scan profile (quick, standard, deep, api_only)"
      fail_on_severity:
        required: false
        type: string
        default: "critical"
        description: "Fail pipeline if findings at this severity or above"
      upload_sarif:
        required: false
        type: boolean
        default: true
        description: "Upload SARIF to GitHub Security tab"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      SHODAN_API_KEY:
        required: false

# Inputs/secrets are retained for caller compatibility. They are intentionally unused
# until an API-backed, authorization-aware CLI assessment is implemented.
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report unavailable scanner integration
        run: |
          echo "::error::NETRA CLI scan is not available. No assessment was performed and no scan artifacts were generated."
          exit 2
