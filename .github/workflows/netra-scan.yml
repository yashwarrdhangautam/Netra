name: NETRA Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 2 AM
    - cron: '0 2 * * 0'

# Keep the check visibly failing until a real authorized assessment is integrated.
# Do not install a published package, scan the repository hosting URL, or upload
# fabricated clean artifacts as a substitute for scanning this source tree.
jobs:
  netra-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report unavailable scanner integration
        run: |
          echo "::error::NETRA CLI scan is not available. No assessment was performed and no scan artifacts were generated."
          exit 2
